events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # Health check endpoint (needed by Docker healthcheck)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Main app — proxies to react-frontend (which is down, returns 502)
        location / {
            proxy_pass http://react-frontend:3000;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            error_page 502 503 504 = @fallback;
        }

        # API proxy — routes to fastapi-backend
        location /api/ {
            proxy_pass http://fastapi-backend:8000;
            proxy_connect_timeout 2s;
            error_page 502 503 = @fallback;
        }

        # Fallback page shown when upstream is down
        location @fallback {
            return 200 "Service temporarily unavailable - check backend status\n";
            add_header Content-Type text/plain;
        }
    }
}
